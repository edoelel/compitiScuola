<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Cambia colore</title>
<style>
    body{
        font-family: 'Times New Roman', Times, serif;
        
    }
</style>
</head>
<body>

<h1 id="testo">Testo di prova</h1>

<label for="font">Scegli un font:</label>
<select id="font">
<option value="">-- Seleziona --</option>
<option value="Georgia">Georgia</option>
<option value="Rockwell">Rockwell</option>
<option value="Comfortaa">Comfortaa</option>
<option value="Arial">Arial</option>
</select>

<button onclick="applicaFont()">Applica colore</button>

<script>
function applicaFont() {
const font = document.getElementById("font").value;
if (font) {
document.getElementById("testo").style.fontFamily = font;
} else {
alert("Seleziona un colore prima di applicarlo");
}
}
</script>

</body>
</html>
